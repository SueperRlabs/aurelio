<style>

.badge{background:linear-gradient(145deg,#0e151f,#090d13)!important;border-color:rgba(215,173,89,.16)!important}.badge.on{border-color:#d7ad59!important;box-shadow:0 0 0 1px rgba(215,173,89,.16) inset,0 0 28px rgba(215,173,89,.08)!important}.rank-row.me{background:linear-gradient(90deg,rgba(39,141,255,.11),rgba(215,173,89,.08))!important}.rank-row.me .rank-name,.stars{color:#d7ad59!important}
#view-quiz{min-height:100vh;background:radial-gradient(circle at 50% 28%,rgba(39,141,255,.14),transparent 31%),radial-gradient(circle at 50% 85%,rgba(215,173,89,.09),transparent 30%)}.quiz-wrap{max-width:760px!important}.q-text{font-family:Georgia,serif!important;font-size:clamp(25px,4.8vw,40px)!important;line-height:1.16!important;text-align:center!important;margin:30px auto!important;max-width:18ch!important}.opts{display:grid!important;gap:12px!important}.opt{background:linear-gradient(145deg,rgba(17,24,35,.97),rgba(8,12,19,.97))!important;border:1px solid rgba(215,173,89,.18)!important;border-radius:16px!important;box-shadow:0 10px 28px rgba(0,0,0,.24)!important}.opt:hover{border-color:#62e7ff!important;transform:translateY(-1px)!important}.opt .key{border-color:rgba(98,231,255,.28)!important;color:#62e7ff!important}.opt.correct{border-color:#5de0bd!important;box-shadow:0 0 32px rgba(93,224,189,.11)!important}.opt.wrong{border-color:#a96d76!important}.ticks .tick.ok{background:linear-gradient(90deg,#62e7ff,#d7ad59)!important}.ticks .tick.now{border-color:#62e7ff!important;box-shadow:0 0 14px rgba(98,231,255,.25)!important}

#view-result{background:radial-gradient(circle at 50% 25%,rgba(39,141,255,.15),transparent 30%),radial-gradient(circle at 50% 75%,rgba(215,173,89,.10),transparent 34%)}.result{max-width:760px!important}.score,.pct{font-family:Georgia,serif!important}.result-grid>div{background:linear-gradient(145deg,rgba(17,24,35,.96),rgba(8,12,19,.96))!important;border-color:rgba(215,173,89,.18)!important}.result-grid b{color:#d7ad59!important}
.tabs{border-color:rgba(215,173,89,.20)!important}.tab{color:#94a3b3!important}.tab.on{color:#62e7ff!important;border-color:#62e7ff!important;background:linear-gradient(180deg,rgba(39,141,255,.10),transparent)!important}.stat,.q-editor,.vrow{background:linear-gradient(145deg,rgba(15,22,32,.96),rgba(8,12,19,.96))!important;border-color:rgba(215,173,89,.16)!important}.stat b{color:#d7ad59!important}
input.f,textarea.f,select.f{background:#080d14!important;border-color:rgba(215,173,89,.18)!important;color:#f4efe5!important}input.f:focus,textarea.f:focus,select.f:focus{border-color:#62e7ff!important;box-shadow:0 0 0 3px rgba(98,231,255,.08)!important}
.quanty-petals{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}.qpetal{position:absolute;top:-6vh;width:7px;height:14px;border-radius:70% 15% 70% 15%;background:linear-gradient(145deg,#7f2338,#cc6667);opacity:.24;animation:qfall linear infinite}.qpetal:nth-child(1){left:8%;animation-duration:16s}.qpetal:nth-child(2){left:22%;animation-duration:19s;animation-delay:-7s}.qpetal:nth-child(3){left:39%;animation-duration:21s;animation-delay:-13s}.qpetal:nth-child(4){left:55%;animation-duration:17s;animation-delay:-4s}.qpetal:nth-child(5){left:71%;animation-duration:20s;animation-delay:-10s}.qpetal:nth-child(6){left:89%;animation-duration:18s;animation-delay:-6s}@keyframes qfall{to{transform:translate3d(80px,112vh,0) rotate(620deg)}}

`;

function textSkin(doc){
  doc.querySelectorAll('.hud-brand').forEach(el=>{el.innerHTML='QUANTY <span>MASTER</span>'});
  doc.querySelectorAll('.bubble .who').forEach(el=>el.textContent='QUANTY');
  doc.querySelectorAll('a[href="index.html"]').forEach(a=>{a.textContent='← QUANTY OS';a.target='_top'});
  doc.querySelectorAll('.eyebrow').forEach(el=>{
    const t=el.childNodes[0]?.nodeValue||'';
    if(t.includes('Ranking del equipo')) el.childNodes[0].nodeValue='SALÓN DE HONOR';
    if(t.includes('Logros')) el.childNodes[0].nodeValue='INSIGNIAS · ';
    if(t.includes('Master detectó')) el.childNodes[0].nodeValue='QUANTY detectó · ';
    if(t.includes('Desafío completado')) el.childNodes[0].nodeValue='PROTOCOLO COMPLETADO';
  });
  const sup=doc.querySelector('#view-sup .hud-brand'); if(sup) sup.textContent='QUANTY COMMAND';
}

function enhanceStates(doc){
  const v=doc.getElementById('verdict');
  if(v && v.textContent){
    if(v.classList.contains('ok') && !v.dataset.quanty){v.textContent='CORRECTO · CONOCIMIENTO ADQUIRIDO';v.dataset.quanty='1';pulse(doc)}
    if(v.classList.contains('bad') && !v.dataset.quanty){v.textContent='RESPUESTA INCORRECTA · CONOCIMIENTO INCORPORADO';v.dataset.quanty='1';}
  }
  const result=doc.getElementById('view-result');
  if(result && result.classList.contains('active')){
    const eyebrow=result.querySelector('.result > .eyebrow'); if(eyebrow) eyebrow.textContent='PROTOCOLO COMPLETADO';
    if(!result.querySelector('.quanty-protocol')){
      const title=result.querySelector('#r-title');
      if(title){const p=doc.createElement('p');p.className='quanty-protocol';p.textContent='DISCIPLINA · CONOCIMIENTO · RESULTADOS';title.insertAdjacentElement('afterend',p);pulse(doc)}
    }
  }
}
function pulse(doc){doc.body.classList.remove('quanty-burst');void doc.body.offsetWidth;doc.body.classList.add('quanty-burst');setTimeout(()=>doc.body.classList.remove('quanty-burst'),900)}

function installSkin(){
  const doc=frame.contentDocument;if(!doc) return;
  if(!doc.getElementById('quanty-skin')){const s=doc.createElement('style');s.id='quanty-skin';s.textContent=skin;doc.head.appendChild(s)}
  if(!doc.querySelector('.quanty-petals')){const p=doc.createElement('div');p.className='quanty-petals';p.innerHTML='<i class="qpetal"></i><i class="qpetal"></i><i class="qpetal"></i><i class="qpetal"></i><i class="qpetal"></i><i class="qpetal"></i>';doc.body.appendChild(p)}
  textSkin(doc);enhanceStates(doc);
  const mo=new MutationObserver(()=>{textSkin(doc);enhanceStates(doc)});mo.observe(doc.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','style']});
  const logout=doc.getElementById('btn-logout'); if(logout) logout.addEventListener('click',()=>setTimeout(()=>top.location.href='index.html',20),{capture:true});
}
function openMaster(){
  if(!frameReady)return;
  installSkin();
  const doc=frame.contentDocument;
  enterBtn.textContent='Activando núcleo…'; enterBtn.disabled=true;
  setTimeout(()=>{const b=doc.getElementById('btn-start');if(b)b.click();},520);
  setTimeout(()=>{frame.classList.add('on');gate.classList.add('hide');},850);
}
frame.addEventListener('load',()=>{
  frameReady=true;
  try{installSkin()}catch(e){console.warn(e)}
  if(wantsEnter)openMaster();
});
enterBtn.addEventListener('click',()=>{wantsEnter=true;openMaster()});
</script>
</body>
</html>
