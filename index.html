<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurelio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1114; --steel:#171A1F; --panel:#1E222A; --panel-2:#252A33; --edge:#333A45;
  --paper:#EDE9E1; --muted:#98A0AC; --amber:#FFC42E; --amber-deep:#E9A800;
  --torch:#FF5A1F; --blueprint:#5FD0DE;
  --shadow:0 18px 40px rgba(0,0,0,.45); --r:14px;
  --display:'Archivo Black','Arial Black',system-ui,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:52px 52px}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--amber) 0 14px,#0F1114 14px 28px);opacity:.85}
.wrap{width:min(1000px,100% - 32px);margin-inline:auto;position:relative;z-index:1}
:focus-visible{outline:3px solid var(--blueprint);outline-offset:3px}

.opening{min-height:100svh;display:grid;place-items:center;text-align:center;padding:40px 16px;position:relative;overflow:hidden}
.opening::before{content:"";position:absolute;inset:-20% -20% auto -20%;height:90%;
  background:radial-gradient(60% 60% at 50% 30%,rgba(255,196,46,.16),transparent 70%);pointer-events:none}
.corp{font-family:var(--cond);font-weight:600;font-size:clamp(12px,3.2vw,16px);letter-spacing:.42em;
  text-transform:uppercase;color:var(--muted);opacity:0}
.screw-stage{height:150px;display:grid;place-items:center;margin:22px 0 6px}
.screw{width:110px;height:110px;opacity:0}
.wordmark{font-family:var(--display);font-size:clamp(52px,15vw,120px);line-height:.86;margin:0;
  text-transform:uppercase;letter-spacing:-.02em;
  background:linear-gradient(180deg,#FFF7DF,var(--amber) 55%,var(--amber-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}
.tagline{font-family:var(--cond);font-size:clamp(15px,4vw,21px);letter-spacing:.3em;text-transform:uppercase;
  color:var(--paper);opacity:0;margin:10px 0 0}
.skip{position:absolute;top:18px;right:18px;background:transparent;border:1px solid var(--edge);color:var(--muted);
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;padding:8px 14px;border-radius:8px;cursor:pointer;text-transform:uppercase}
.skip:hover{border-color:var(--amber);color:var(--amber)}

.view{display:none}
.view.active{display:block}

.plate{background:linear-gradient(180deg,var(--panel),var(--steel));border:1px solid var(--edge);
  border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden;padding:22px}
.plate::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0}
.eyebrow b{color:var(--amber);font-weight:600}
h2{font-family:var(--display);text-transform:uppercase;margin:8px 0 0;font-size:clamp(26px,6vw,40px);letter-spacing:-.01em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--cond);font-weight:700;
  font-size:17px;letter-spacing:.1em;text-transform:uppercase;padding:15px 26px;border-radius:10px;border:1px solid transparent;
  cursor:pointer;background:var(--amber);color:#14110A;box-shadow:0 6px 0 var(--amber-deep),0 14px 26px rgba(0,0,0,.4);
  transition:transform .12s ease}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--amber-deep)}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--edge);box-shadow:none}
.btn.ghost:hover{border-color:var(--amber);color:var(--amber)}
.btn.small{padding:10px 16px;font-size:14px}

.tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}
.tab{font-family:var(--cond);letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:10px 16px;
  border-radius:9px;background:transparent;border:1px solid var(--edge);color:var(--paper);cursor:pointer}
.tab.on{background:var(--amber);color:#14110A;border-color:var(--amber)}
label.f{display:block;margin:14px 0 0}
label.f span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
input.f{width:100%;margin-top:6px;background:#12151A;border:1px solid var(--edge);color:var(--paper);
  border-radius:10px;padding:12px 14px;font-family:var(--body);font-size:16px}
.err{color:var(--torch);font-family:var(--mono);font-size:12px;margin:10px 0;min-height:16px}
.hint-line{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:14px;line-height:1.7}

.bar{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;cursor:pointer;background:none;border:0;color:inherit;text-align:left;padding:0}
.brand span{color:var(--amber)}
.brand small{display:block;font-family:var(--cond);font-size:11px;letter-spacing:.26em;color:var(--muted);
  text-transform:uppercase;font-weight:600;margin-top:2px}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12px;padding:7px 11px;border-radius:8px;border:1px solid var(--edge);background:var(--panel)}
.chip b{color:var(--amber);font-weight:600}

.hello{margin:34px 0 20px}
.cards{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{text-align:left;padding:22px;border-radius:var(--r);cursor:pointer;position:relative;overflow:hidden;display:block;
  background:linear-gradient(180deg,var(--panel),var(--steel));border:1px solid var(--edge);box-shadow:var(--shadow);
  transition:transform .16s ease,border-color .2s ease;color:inherit;text-decoration:none}
.card::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
.card:hover{transform:translateY(-3px);border-color:var(--amber)}
.bolt{width:56px;height:56px;display:grid;place-items:center;font-size:24px;margin-bottom:16px;
  clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:var(--panel-2);color:var(--amber)}
.card h3{font-family:var(--display);font-size:23px;margin:0;text-transform:uppercase;letter-spacing:-.01em}
.card .sub{font-family:var(--cond);font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin:6px 0 10px}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.card .go{margin-top:16px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--paper);text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="hazard"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ico-screw" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="52" fill="#3A414C"/>
    <circle cx="60" cy="60" r="44" fill="#8B94A2"/>
    <circle cx="60" cy="60" r="44" fill="none" stroke="#C9D2DE" stroke-width="2"/>
    <g stroke="#5A6270" stroke-width="4" stroke-linecap="round"><path d="M60 26v68M26 60h68"/></g>
    <g stroke="#3A414C" stroke-width="3" opacity=".7">
      <path d="M60 8v10M60 102v10M8 60h10M102 60h10M23 23l7 7M90 90l7 7M97 23l-7 7M30 90l-7 7"/>
    </g>
  </symbol>
</svg>

<section class="opening" id="opening">
  <button class="skip" id="skip">Saltar intro</button>
  <div class="wrap">
    <p class="corp">Stanley Black + Decker</p>
    <div class="screw-stage"><svg class="screw" id="screw"><use href="#ico-screw"/></svg></div>
    <h1 class="wordmark">Aurelio</h1>
    <p class="tagline">Built for the shop floor</p>
  </div>
</section>

<section id="view-login" class="view">
  <div class="wrap" style="max-width:440px;padding:40px 0 70px">
    <p class="eyebrow">Acceso</p>
    <h2>Entrar</h2>
    <div class="tabs">
      <button class="tab on" data-login="vend">Vendedor</button>
      <button class="tab" data-login="sup">Supervisor</button>
    </div>
    <div class="plate" id="login-vend">
      <label class="f"><span>Usuario</span><input class="f" id="l-user" autocapitalize="none" autocomplete="username" placeholder="camila"></label>
      <label class="f"><span>Clave</span><input class="f" id="l-pass" type="password" autocomplete="current-password"></label>
      <p class="err" id="l-err"></p>
      <button class="btn" id="btn-login">Entrar</button>
      <p class="hint-line">Demo: camila / 1234</p>
    </div>
    <div class="plate" id="login-sup" style="display:none">
      <label class="f"><span>Clave de supervisor</span><input class="f" id="s-pass" type="password" inputmode="numeric" placeholder="••••"></label>
      <p class="err" id="s-err"></p>
      <button class="btn" id="btn-login-sup">Entrar al panel</button>
    </div>
  </div>
</section>

<section id="view-hub" class="view">
  <div class="wrap" style="padding-bottom:70px">
    <div class="bar">
      <button class="brand" id="brand">AURELIO<span>.</span><small>Built for the shop floor</small></button>
      <div class="who">
        <span class="chip" id="chip"><b>—</b></span>
        <button class="btn ghost small" id="btn-out">Salir</button>
      </div>
    </div>
    <div class="hello">
      <p class="eyebrow">Elige dónde quieres entrar</p>
      <h2>Bienvenido</h2>
    </div>
    <div class="cards" id="cards"></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ============================================================
   AURELIO · portada
   Comparte con master.html las mismas claves de almacenamiento,
   así el acceso creado en un módulo sirve en el otro.
   Al migrar a Supabase, esta capa pasa a consultar la base.
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const Store={
  get(k){ try{ const v=localStorage.getItem(k); return v!=null?JSON.parse(v):null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const SUP_PIN='6060';

/* equipo de demostración: se crea una sola vez */
function buildProgress(scores, repasar, bestStreak){
  let xp=0; const done={};
  Object.entries(scores).forEach(([cid,ok])=>{
    xp += 500 + ok*100 + (ok===5?200:0);
    done[cid]={correctas:ok, pct:ok*20, segundos:80};
  });
  const badges=[];
  if(Object.keys(done).length) badges.push('first');
  if(Object.values(done).some(d=>d.correctas===5)) badges.push('perfect');
  if(bestStreak>=5) badges.push('streak5');
  if(['c1','c2','c3'].every(c=>done[c])) badges.push('tools');
  if(['c4','c5'].every(c=>done[c])) badges.push('sales');
  if(xp>=5000) badges.push('master');
  return {xp,done,badges,bestStreak,repasar};
}
const DEMO_USERS=()=>([
 {id:'u1',nombre:'Camila Soto',usuario:'camila',clave:'1234',rol:'vendedor',
  progreso:buildProgress({c1:5,c2:5,c3:4,c4:5,c5:4},[{c:'c3',q:2},{c:'c5',q:2}],5)},
 {id:'u2',nombre:'Nicolás Vera',usuario:'nicolas',clave:'1234',rol:'vendedor',
  progreso:buildProgress({c1:5,c2:4,c3:3,c4:4},[{c:'c2',q:2},{c:'c3',q:2},{c:'c4',q:3}],4)},
 {id:'u3',nombre:'Ignacio Rojas',usuario:'ignacio',clave:'1234',rol:'vendedor',
  progreso:buildProgress({c1:4,c2:3,c4:4},[{c:'c1',q:3},{c:'c2',q:2},{c:'c4',q:3}],3)},
 {id:'u4',nombre:'Paula Muñoz',usuario:'paula',clave:'1234',rol:'vendedor',
  progreso:buildProgress({c1:5,c4:3},[{c:'c4',q:0},{c:'c4',q:4}],5)},
 {id:'u5',nombre:'Diego Cárdenas',usuario:'diego',clave:'1234',rol:'vendedor',
  progreso:buildProgress({c1:3},[{c:'c1',q:1},{c:'c1',q:3}],2)}
]);
const DEMO_STATS=()=>({
 c1:{0:{ok:5,fail:0},1:{ok:4,fail:1},2:{ok:5,fail:0},3:{ok:3,fail:2},4:{ok:4,fail:1}},
 c2:{0:{ok:3,fail:0},1:{ok:2,fail:1},2:{ok:1,fail:3},3:{ok:3,fail:0},4:{ok:3,fail:0}},
 c3:{0:{ok:2,fail:0},1:{ok:2,fail:0},2:{ok:1,fail:2},3:{ok:2,fail:0},4:{ok:2,fail:1}},
 c4:{0:{ok:4,fail:0},1:{ok:3,fail:1},2:{ok:3,fail:1},3:{ok:2,fail:2},4:{ok:3,fail:1}},
 c5:{0:{ok:2,fail:0},1:{ok:2,fail:0},2:{ok:1,fail:2},3:{ok:2,fail:0},4:{ok:2,fail:0}}
});
if(!Store.get('master:users')){
  Store.set('master:users', DEMO_USERS());
  Store.set('master:stats', DEMO_STATS());
  Store.set('master:seeded', true);
}

const MODULOS=[
 {id:'asis', file:'mi-turno.html', icono:'◷', titulo:'Mi turno', sub:'Horario del equipo',
  vend:'Revisa tu semana, pide un día libre o cambia un turno.',
  sup:'Consulta los turnos publicados tal como los ve el equipo.', roles:['vendedor','supervisor']},
 {id:'mallas', file:'mallas.html', icono:'▦', titulo:'Motor de mallas', sub:'Planificación',
  sup:'Genera y valida la malla de turnos según las reglas del comercio.', roles:['supervisor']},
 {id:'master', file:'master.html', icono:'★', titulo:'Master', sub:'Jugando aprendo',
  vend:'Desafíos de producto y de venta. Gana XP, sube de nivel y compite.',
  sup:'Crea desafíos, administra el equipo y revisa la analítica.', roles:['vendedor','supervisor']}
];

let sesion=Store.get('aurelio:sesion');

function intro(despues){
  $('#opening').style.display='grid';
  $$('.view').forEach(v=>v.classList.remove('active'));
  window.scrollTo(0,0);
  if(!window.gsap || matchMedia('(prefers-reduced-motion: reduce)').matches){
    gsap && gsap.set('.corp,#screw,.wordmark,.tagline',{opacity:1});
    return setTimeout(despues,400);
  }
  gsap.timeline({defaults:{ease:'power2.out'}, onComplete:despues})
    .fromTo('.corp',{opacity:0,letterSpacing:'1em'},{opacity:1,letterSpacing:'.42em',duration:1.1})
    .fromTo('#screw',{opacity:0,y:-180,rotation:-720,scale:.4},{opacity:1,y:0,rotation:0,scale:1,duration:1.2},'-=.35')
    .to('#screw',{rotation:200,scale:.15,opacity:0,duration:.6,ease:'power2.in'},'+=.2')
    .fromTo('.wordmark',{opacity:0,scale:1.4,filter:'blur(16px)'},{opacity:1,scale:1,filter:'blur(0px)',duration:.8},'-=.35')
    .fromTo('.tagline',{opacity:0,y:16},{opacity:1,y:0,duration:.5},'-=.1')
    .to({},{duration:.7});
}
function nav(id){
  gsap.to('#opening',{opacity:0,duration:.35,onComplete:()=>{
    $('#opening').style.display='none'; $('#opening').style.opacity=1;
    $$('.view').forEach(v=>v.classList.remove('active'));
    $('#'+id).classList.add('active');
    window.scrollTo(0,0);
    gsap.fromTo('#'+id+' .wrap > *',{opacity:0,y:20},{opacity:1,y:0,stagger:.06,duration:.45,ease:'power2.out'});
  }});
}
function entrar(){ sesion ? verHub() : nav('view-login'); }

function verHub(){
  const rol=sesion.rol;
  $('#chip').innerHTML = rol==='supervisor' ? '<b>Supervisor</b>' : '<b>'+sesion.nombre.split(' ')[0]+'</b>';
  $('#cards').innerHTML = MODULOS.filter(m=>m.roles.includes(rol)).map(m=>`
    <a class="card" href="${m.file}">
      <span class="bolt">${m.icono}</span>
      <h3>${m.titulo}</h3>
      <p class="sub">${m.sub}</p>
      <p>${rol==='supervisor'?m.sup:(m.vend||m.sup)}</p>
      <p class="go">Abrir →</p>
    </a>`).join('');
  nav('view-hub');
}

$$('[data-login]').forEach(t=>t.onclick=()=>{
  $$('[data-login]').forEach(x=>x.classList.remove('on')); t.classList.add('on');
  const v=t.dataset.login==='vend';
  $('#login-vend').style.display=v?'block':'none';
  $('#login-sup').style.display=v?'none':'block';
});
function loginVend(){
  const err=$('#l-err'); err.textContent='';
  const u=$('#l-user').value.trim().toLowerCase(), c=$('#l-pass').value;
  const users=Store.get('master:users')||[];
  const f=users.find(x=>x.usuario===u && x.clave===c && x.rol==='vendedor');
  if(!f) return err.textContent='Usuario o clave incorrectos.';
  sesion={id:f.id, nombre:f.nombre, usuario:f.usuario, rol:'vendedor'};
  Store.set('aurelio:sesion', sesion);
  $('#l-user').value=$('#l-pass').value='';
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('#opening').style.display='grid'; $('#opening').style.opacity=1;
  verHub();
}
function loginSup(){
  const err=$('#s-err'); err.textContent='';
  if($('#s-pass').value.trim()!==SUP_PIN) return err.textContent='Clave incorrecta.';
  $('#s-pass').value='';
  sesion={id:'sup', nombre:'Supervisor', rol:'supervisor'};
  Store.set('aurelio:sesion', sesion);
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('#opening').style.display='grid'; $('#opening').style.opacity=1;
  verHub();
}
$('#btn-login').onclick=loginVend;
$('#l-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') loginVend(); });
$('#btn-login-sup').onclick=loginSup;
$('#s-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') loginSup(); });
$('#btn-out').onclick=()=>{ Store.del('aurelio:sesion'); sesion=null; intro(entrar); };
$('#brand').onclick=()=>intro(entrar);
$('#skip').onclick=()=>{ gsap.globalTimeline.clear(); entrar(); };

/* la intro completa se ve una vez por sesión de navegador */
if(sessionStorage.getItem('aurelio:intro')){
  $('#opening').style.display='none';
  $$('.view').forEach(v=>v.classList.remove('active'));
  sesion ? verHubDirecto() : $('#view-login').classList.add('active');
}else{
  try{ sessionStorage.setItem('aurelio:intro','1'); }catch(e){}
  intro(entrar);
}
function verHubDirecto(){
  const rol=sesion.rol;
  $('#chip').innerHTML = rol==='supervisor' ? '<b>Supervisor</b>' : '<b>'+sesion.nombre.split(' ')[0]+'</b>';
  $('#cards').innerHTML = MODULOS.filter(m=>m.roles.includes(rol)).map(m=>`
    <a class="card" href="${m.file}">
      <span class="bolt">${m.icono}</span><h3>${m.titulo}</h3><p class="sub">${m.sub}</p>
      <p>${rol==='supervisor'?m.sup:(m.vend||m.sup)}</p><p class="go">Abrir →</p></a>`).join('');
  $('#view-hub').classList.add('active');
}
</script>
</body>
</html>
